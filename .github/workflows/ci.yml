name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,maps]"
      # Offline by default. The network- and catalog-dependent tests gate on
      # EMDB_NETWORK / EMDB_CATALOG_JSON so CI never depends on EBI being up.
      - run: pytest -q
